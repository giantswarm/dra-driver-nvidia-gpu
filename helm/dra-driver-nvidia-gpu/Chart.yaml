apiVersion: v2
name: dra-driver-nvidia-gpu
description: Official Helm chart for the DRA Driver for NVIDIA GPUs
type: application
icon: https://s.giantswarm.io/app-icons/kubernetes-gpu/1/light.svg

# Note(JP): strict semver: no v prefix allowed
#
# Giant Swarm: the chart version is deliberately DECOUPLED from `appVersion`.
# Upstream re-versioned from calendar versions (v25.12.0) to semver starting at
# v0.4.0, but this chart is already published in the Giant Swarm catalog at
# 25.3.2-flatcar.1. Under semver 0.5.0 < 25.3.2, so following upstream's number
# here would make the catalog treat this release as OLDER than what clusters are
# already running and never offer it as an upgrade.
#
# So the chart keeps its own monotonic Giant Swarm line while `appVersion`
# tracks upstream exactly. 26.0.0 rather than 25.4.0 because this release is
# breaking: `extraDriverBinaryPaths`, `extraDriverLibraryPaths` and
# `extraHostPathMounts` are gone, and the driver now requires NVIDIA 570+.
version: "26.0.0"

# Note(JP): templating logic consumes `appVersion` for building the default
# `tag` value used in a k8s image specification. That logic expects the version
# number below to not have a "v" prefix (a "v" is added by said logic to yield a
# valid image reference).
appVersion: "0.5.0"

# The kubeVersion puts constraints on the Kubernetes versions where this helm
# chart can be installed. Note a '-0' at the end of a version string in the
# kubeVersion generally indicates that all pre-release versions should also be
# included. However, it is also required to allow a given chart to be installed
# on GKE as they add a '-gke-*' suffix to all of their Kubernetes versions.
kubeVersion: ">=1.32.0-0"

annotations:
  application.giantswarm.io/team: tenet
  io.giantswarm.application.audience: all
